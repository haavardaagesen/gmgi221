name: deploy-book

on:
  push:
    branches: main
  workflow_dispatch:

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up the gmgi221 conda environment
      uses: mamba-org/setup-micromamba@v2
      with:
        environment-file: environment.yml
        cache-environment: true

    - name: Clean previous build + remove checkpoints
      run: |
        echo "Removing prior _build and any .ipynb_checkpoints or _toc-checkpoint.yml"
        rm -rf _build
        find . -type d -name ".ipynb_checkpoints" -prune -exec rm -rf {} + || true
        find . -name "_toc-checkpoint.yml" -exec rm -f {} + || true
        echo "Tracked checkpoint files (should be none):"
        git ls-files | egrep -i "\.ipynb_checkpoints|_toc-checkpoint.yml" || true

    - name: Diagnostics
      run: |
        echo "===== Environment ====="
        python --version
        which python
        jupyter-book --version
        echo
        echo "===== Installed packages ====="
        micromamba list
        echo
        echo "===== _toc.yml (head) ====="
        sed -n '1,60p' _toc.yml || true

    - name: Build the book (verbose log)
      run: |
        echo "Start build at $(date)"
        set -o pipefail
        jupyter-book build . > build.log 2>&1 || { echo "Build failed — dumping build.log"; tail -n 500 build.log; exit 1; }
        echo "Build succeeded — tail of build.log:"
        tail -n 200 build.log

    - name: Verify build output
      run: |
        if [ -d "_build/html" ]; then
          ls -la _build/html
        else
          echo "_build/html missing — build failed"
          exit 1
        fi

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _build/html

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      with:
        clean: true
